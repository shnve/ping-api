---
info.app:
  name: '@project.name@'
  version: '@project.version@'

management:
  endpoints.web:
    exposure:
      include: health,info
  info:
    env:
      enabled: true

server:
  error:
    include-message: always
  port: ${SERVER_PORT:8080}

springdoc:
  paths-to-exclude: /admin-api/**
  swagger-ui:
    path: /swagger-ui

ping:
  portal-url: ${PING_PORTAL_URL:http://localhost:4200}
  services-url: ${PING_SERVICES_URL:http://localhost:8180}
  shom-organization-info:
    name: "Servicio de Hidrografía y Navegación (SHN)"
    address: "Observatorio Naval Cagigal, La Planicie, Caracas"
    country: Venezuela
    electronic-mail-address: ${SHN_CONTACT_EMAIL:}
    function: information
    linkage: ${ping.portal-url}
    resource-name: PISAC - Plataforma de información de seguridad acuática
  root-folder: ${PING_ROOT_FOLDER:/tmp/pisac-api}
  upload-folder: ${ping.root-folder}/attachments
  temp-folder-for-archive-files: ${ping.root-folder}/archives
  generated-shapefile-folder: ${ping.root-folder}/shapefiles
  generated-gpx-folder: ${ping.root-folder}/gpx
  generated-navtex-folder: ${ping.root-folder}/navtex
  generated-s124-folder: ${ping.root-folder}/s124
  s124-sanitize-regex: "[/\\\\:*?\"<>|]"
  s100-root-folder-name: "S100_ROOT"
  certificates-folder-name: "Certs"
  s124-folder-name: "S-124"
  dataset-files-folder-name: "DATASET_FILES"
  georegulation-max-global-period-duration-in-days: 30
  max-upload-file-size-in-megabytes: 50
  max-upload-file-size-in-gigabytes-for-survey: 10
  static-logo-min-height: 5
  static-logo-max-height: 500
  secom-page-size-max: 40
  proxy:
    proxy-host: proxy-internet.localnet
    proxy-port: 3128
    use-proxy: true
  shedlock:
    default-lock-time-at-most-for: PT30S
    lock-time-at-least-for: PT5M
    lock-time-at-most-for: PT10M
  keycloak:
    server-url: ${ping.services-url}
    pool-size: 10
    public-realm:
      realm: ping-public
      admin-client:
        client-id: ping-admin
        client-secret: ${KEYCLOAK_PUBLIC_ADMIN_SECRET:CHANGE_ME}
      api-client:
        client-id: ping-api
        client-secret: ${KEYCLOAK_PUBLIC_API_SECRET:CHANGE_ME}
    pro-realm:
      realm: ping-pro
      admin-client:
        client-id: ping-admin
        client-secret: ${KEYCLOAK_PRO_ADMIN_SECRET:CHANGE_ME}
      api-client:
        client-id: ping-api
        client-secret: ${KEYCLOAK_PRO_API_SECRET:CHANGE_ME}
    roles:
      functional-admin: functional-admin
      service-user: service-user
    principal-attribute: preferred_username
    pro-issuer-uri: ${ping.keycloak.server-url}/realms/${ping.keycloak.pro-realm.realm}
    public-issuer-uri: ${ping.keycloak.server-url}/realms/${ping.keycloak.public-realm.realm}
  security:
    ignored-paths:
      - /error
      - /internal/**
    csrf-allowed-request-uris:
      - /**
  cors:
    allowed-origins:
      - ${ping.portal-url}
      - http://localhost:4200
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Content-Disposition
      - Authorization
    allow-credentials: true
    register-on-path: /**
    exposed-headers:
      - Content-Disposition

  georegulations-cron-check-links:
    cron-value: 0 0 7,19 * * *
    email-recipient: ${GEOREGULATIONS_ALERT_EMAIL:}
    email-subject: Regulaciones con enlaces externos inválidos
    email-body-start: 'Los enlaces externos de las regulaciones listadas a continuación son inválidos :'

  notifications.connection:
    timeout: ${SSE_TIMEOUT:32400000}
    heartbeat: ${SSE_HEARTBEAT_INTERVAL:30000}


  subscription-notification:
    email-front-link-root: ${ping.portal-url}
    email-access-warning-link: /avurnav-notice/
    email-access-georegulation-link: /georegulation-visu/
    email-delete-subscription-link: /subscription/delete/

  email-notification:
    email-front-link-root: ${ping.portal-url}
    email-access-infosource-link: /infosource/tables/

  survey-external-analysis-mail:
    email-subject: "Análisis Cartonaut terminado"
    email-body-end-with-critical-probes: "Tras su solicitud de {{surveyType}} del {{dateTime}}, el robot Cartonaut ha encontrado profundidades muy inferiores a las indicadas en las cartas. Es necesario reportar estas profundidades sin demora.<br/><a href=\"{{link}}\">Ver el resultado</a> del análisis de Cartonaut, incluyendo la propuesta de reporte."
    email-body-end-without-critical-probe: "Tras su solicitud de {{surveyType}} del {{dateTime}}, el robot Cartonaut no encontró profundidades muy inferiores a las indicadas en las cartas.<br/><a href=\"{{link}}\">Ver el resultado</a> del análisis de Cartonaut."
    email-body-end-with-failure: "Tras su solicitud de {{surveyType}} del {{dateTime}}, el robot Cartonaut no pudo producir un resultado. Le invitamos a verificar si su levantamiento revela profundidades peligrosas no indicadas en las cartas marinas. En caso de profundidades peligrosas, diríjase a la sección <a href=\"{{link}}\">Contribuir/Nuevo reporte de información</a>."
    email-access-survey-link: /survey/tables/
    email-access-new-contribution-link: /infosource/choice

  gpx-disclaimer:
    fr: "Advertencia: estos datos GPX generados desde PISAC son parciales y solo están destinados a facilitar la integración de la posición de la advertencia de navegación o aviso a los navegantes en una carta digital. La información completa está disponible en el portal PISAC."
    en: "Disclaimer : these GPX data generated from PISAC are partial and only intended to facilitate the integration of the position of the navigation warning or notice to mariners into a digital map. The full information is available on the PISAC portal."

  upload-extensions:
    - csv
    - xyz
    - pts
    - lgz
    - glz
    - asc
    - rar
    - dat
    - csar
    - LAS
    - odt
    - ods
    - gml
    - gpkg
    - dxf
    - dwg
    - tiff
    - docx
    - xlsx
    - pptx
    - doc
    - xls
    - ppt
    - tar
    - 7z
    - zip
    - gz
    - eml
    - pdf
    - txt
    - xml
    - svg
    - jpg
    - png
    - gif
    - jfif
    - kml
    - shp
    - gpx
    - dbf
    - shx
    - sbn
    - sbx
    - fbn
    - fbx
    - ain
    - aih
    - prj
    - shp.xml
    - atx
    - ixs
    - mxs
    - cpg
    - qix

  upload-extensions-for-survey-misc:
    - csv
    - txt
    - xyz
    - pts
    - lgz
    - glz
    - asc
    - zip
    - 7z
    - gz
    - rar
    - dat
    - csar
    - LAS
    - pdf
    - xls
    - xlsx
    - doc
    - docx
    - odt
    - ods
    - gml
    - shp
    - gpkg
    - dxf
    - dwg
    - tiff
    - png

  upload-extensions-for-survey-bathy:
    - csv
    - txt
    - xyz
    - pts
    - lgz
    - glz
    - asc
    - zip
    - 7z
    - gz
    - rar
    - dat

  clamav:
    host: localhost
    port: 4310
    sync-analysis-threshold: 45
    clamav-replaced-path: ${ping.root-folder}
    clamav-replacement-path: ${ping.root-folder}

  survey-file-analysis-line-compliant-header-read-offset: 4

  bypass-external-analysis-fingerprint: false
  bypass-external-search-fingerprint: false
  authorized-certificate-fingerprints:
    - XXX
    - XXX

  cartonaut-sftp: ${ping.root-folder}/sftp_cartonaut
  surveys-working-dir: ${ping.root-folder}/surveys
  enable-bathy-dangers-integration: false
  max-polygon-vertices-for-is-bathy: 4
  generated-survey-zip-archive-folder: ${ping.root-folder}/survey-archives
  cartonaut-sftp-root-relative-path: /chemin/relatif/sftp_cartonaut
  keystore:
    path: secom/secom_keystore.jks
    password: ${KEYSTORE_PASSWORD:CHANGE_ME}
    s100:
      alias-ca: s100_root
      alias-shom: shn
    secom:
      alias-ca: secom_root
      alias-secom: ping_secom

  cartography:
    storage-base-path: ${CARTOGRAPHY_STORAGE_PATH:db/geotiff}
    temp-path: ${CARTOGRAPHY_TEMP_PATH:/tmp/pisac-cartography}
    geoserver-url: ${GEOSERVER_URL:http://localhost:8082/geoserver}
    geoserver-user: ${GEOSERVER_USER:CHANGE_ME}
    geoserver-password: ${GEOSERVER_PASSWORD:CHANGE_ME}
    geoserver-workspace: ${GEOSERVER_WORKSPACE:pisac_shn}
    geoserver-layer-group: ${GEOSERVER_LAYER_GROUP:cartografia_ve}
    docker-image: ${GDAL_DOCKER_IMAGE:ghcr.io/osgeo/gdal:ubuntu-full-latest}
    pdf-dpi: ${CARTOGRAPHY_PDF_DPI:300}

kafka:
  bootstrapAddress: ${KAFKA_BOOTSTRAP_ADDRESS:localhost:9092}
  topicName: lighthouseAndBeaconInfosourceTopic
  groupId: pingGroup
  individualGroupId: ${KAFKA_INDIVIDUAL_GROUP:pingIndividualGroup}
  containerFactory: lighthouseAndBeaconInfosourceMessageDtoListenerContainerFactory
  sissy-update-topic-name: sissyUpdateTopic
  sse-notification-topic-name: sseNotificationTopic
  sse-notification-transactional-id: sse-transactional-id
  sseContainerFactory: sseNotificationListenerContainerFactory
  invalid-georegulations-links-topic-name: pingEmailTopic
  subscription-mail-notification-topic-name: pingEmailTopic
  infosource-received-notification-topic-name: pingEmailTopic
  survey-external-analysis-notification-topic-name: pingEmailTopic

keycloak:
  server-url: ${ping.services-url}
  pool-size: 10
  public-realm:
    realm: ping-public
    admin-client:
      client-id: ping-admin
      client-secret: ${KEYCLOAK_PUBLIC_ADMIN_SECRET:CHANGE_ME}
    api-client:
      client-id: ping-api
      client-secret: ${KEYCLOAK_PUBLIC_API_SECRET:CHANGE_ME}
  pro-realm:
    realm: ping-pro
    admin-client:
      client-id: ping-admin
      client-secret: ${KEYCLOAK_PRO_ADMIN_SECRET:CHANGE_ME}
    api-client:
      client-id: ping-api
      client-secret: ${KEYCLOAK_PRO_API_SECRET:CHANGE_ME}
  roles:
    functional-admin: functional-admin
    service-user: service-user
  principal-attribute: preferred_username
  pro-issuer-uri: ${ping.keycloak.server-url}/realms/${ping.keycloak.pro-realm.realm}
  public-issuer-uri: ${ping.keycloak.server-url}/realms/${ping.keycloak.public-realm.realm}

spring:
  security:
    oauth2:
      client:
        provider:
          ping-pro:
            token-uri: ${ping.keycloak.server-url}/realms/${ping.keycloak.pro-realm.realm}/protocol/openid-connect/token
            authorization-uri: ${ping.keycloak.server-url}/realms/${ping.keycloak.pro-realm.realm}/protocol/openid-connect/auth
          ping-public:
            token-uri: ${ping.keycloak.server-url}/realms/${ping.keycloak.public-realm.realm}/protocol/openid-connect/token
            authorization-uri: ${ping.keycloak.server-url}/realms/${ping.keycloak.public-realm.realm}/protocol/openid-connect/auth
        registration:
          ping-admin-pro:
            provider: ping-pro
            authorization-grant-type: authorization_code
            redirect-uri: ${ping.portal-url}
            client-id: ping-admin
            client-secret: ${ping.keycloak.pro-realm.admin-client.client-secret}
            scope:
              - openid
          ping-api-pro:
            provider: ping-pro
            authorization-grant-type: authorization_code
            redirect-uri: ${ping.portal-url}
            client-id: ping-api
            client-secret: ${ping.keycloak.pro-realm.api-client.client-secret}
            scope:
              - openid
          ping-admin-public:
            provider: ping-public
            authorization-grant-type: authorization_code
            redirect-uri: ${ping.portal-url}
            client-id: ping-admin
            client-secret: ${ping.keycloak.public-realm.admin-client.client-secret}
            scope:
              - openid
          ping-api-public:
            provider: ping-public
            authorization-grant-type: authorization_code
            redirect-uri: ${ping.portal-url}
            client-id: ping-api
            client-secret: ${ping.keycloak.public-realm.api-client.client-secret}
            scope:
              - openid

  liquibase:
    change-log: classpath:db/db.changelog.xml
    contexts: prod
  jpa:
    hibernate.ddl-auto: validate
    database-platform: fr.shom.ping.PostgisPG95JsonDialect
    properties.hibernate.jdbc.time_zone: UTC
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet.multipart:
    max-file-size: 500MB
    max-request-size: 500MB
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
      schema: classpath:quartz/schema.sql
    properties:
      org:
        quartz:
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            useProperties: true
            misfireThreshold: 60000
            tablePrefix: qrtz_
            isClustered: true
            clusterCheckinInterval: 5000
          scheduler:
            instanceName: ping-scheduler
            instanceId: AUTO
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 25
            threadPriority: 5
          plugin:
            shutdownHook:
              class: org.quartz.plugins.management.ShutdownHookPlugin
              cleanShutdown: TRUE

resilience4j:
  ratelimiter:
    metrics:
      enabled: true
    instances:
      rateLimiterUserCreateAPI:
        limitForPeriod: 5
        limitRefreshPeriod: 60s
        timeoutDuration: 1s

---
spring:
  config:
    activate:
      on-profile: test

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  liquibase:
    change-log: classpath:db/db.changelog-tests.xml
    contexts: test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;NON_KEYWORDS=year,value
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        globally_quoted_identifiers: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

ping:
  services-url: https://pp-services.ping.shom.fr
  proxy:
    use-proxy: false

---
spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  kafka:
    bootstrap-servers: ""
    listener:
      auto-startup: false
  sql:
    init:
      platform: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ping-api}
    username: ${POSTGRES_USER:ping-api}
    password: ${POSTGRES_PASSWORD:CHANGE_ME}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true 
logging:
  level:
    org:
      springframework:
        security: trace
        jdbc.core: trace
        kafka: INFO
      keycloak: debug
      hibernate:
        type.descriptor.sql.BasicBinder: trace
    fr.shom.ping: debug
    org.apache.kafka: INFO
ping:
  proxy:
    use-proxy: false
  cors:
    allowed-origins:
      - ${ping.portal-url}
      - http://localhost:4200
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Content-Disposition
      - Authorization
    allow-credentials: true
    exposed-headers:  # <--- Fíjate que esté alineado con 'allow-credentials'
      - Content-Disposition
  cartography:
    temp-path: ${CARTOGRAPHY_TEMP_PATH:C:/tmp/pisac-cartography}
---
spring:
  config:
    activate:
      on-profile: local-prod

  sql:
    init:
      platform: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ping-api-prod?currentSchema=ping_api}
    username: ${POSTGRES_USER:ping-api}
    password: ${POSTGRES_PASSWORD:CHANGE_ME}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  liquibase:
    contexts: prod

logging:
  level:
    org:
      springframework.security: debug
      keycloak: debug
      hibernate:
        type.descriptor.sql.BasicBinder: trace
    fr.shom.ping: debug

---
spring:
  config:
    activate:
      on-profile: deploy

  sql:
    init:
      platform: postgres
  datasource:
    url: jdbc:postgresql://${JDBC_HOST}:${JDBC_PORT}/${JDBC_DATABASE}
    username: ${JDBC_USER}
    # JDBC_PASSWORD must be set as environment variable on server
    password : ${JDBC_PASSWORD}
  jpa:
    show-sql: ${PING_API_JPA_SHOW_SQL:false}

  liquibase:
    contexts: qlf

logging:
  level:
    org:
      springframework.security: ${PING_LOG_LEVEL_SECURITY:warn}
      keycloak: ${PING_LOG_LEVEL_KEYCLOAK:warn}
      hibernate:
        type.descriptor.sql.BasicBinder: ${PING_LOG_LEVEL_HIBERNATE:warn}
    fr.shom.ping: ${PING_LOG_LEVEL_SHOMPING:warn}

ping:
  portal-url: https://${PING_PORTAL_URL}
  services-url: https://${PING_SERVICES_EXT_URL}
  root-folder: /DATA/pisac/api
  proxy:
    proxy-host: ${PROXY_HOST}
    proxy-port: ${PROXY_PORT}
    use-proxy: ${USE_PROXY:true}
  cors:
    allowed-origins:
      - https://${PING_PORTAL_URL}

  bypass-external-analysis-fingerprint: ${BYPASS_EXTERNAL_ANALYSIS_FINGERPRINT:false}
  bypass-external-search-fingerprint: ${BYPASS_EXTERNAL_SEARCH_FINGERPRINT:false}
  cartonaut-sftp-root-relative-path: ${CARTONAUT_SFTP_ROOT_RELATIVE_PATH:/chemin/relatif/sftp_cartonaut}
  enable-bathy-dangers-integration: ${ENABLE_BATHY-DANGERS_INTEGRATION:false}

