# PISAC: requiere Docker Compose v2 (mem_limit y bloques x-*).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  ping_api_clamav:
    image: clamav/clamav:stable_base
    container_name: ping_api_clamav
    restart: unless-stopped
    <<: *logging
    # Las firmas ocupan ~1,5 GB y el doble durante la actualización diaria
    mem_limit: 4g
    volumes:
      - clam_db:/var/lib/clamav
      - /mnt/c/tmp/ping-api:/mnt/c/tmp/ping-api
      - /DATA/ping/api:/DATA/ping/api
    #environment:
    #  CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "127.0.0.1:4310:3310"

volumes:
  clam_db:
