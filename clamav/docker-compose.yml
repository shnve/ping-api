version: '3.1'

services:
  ping_api_clamav:
    image: clamav/clamav:stable_base
    container_name: ping_api_clamav
    volumes:
      - clam_db:/var/lib/clamav
      - /mnt/c/tmp/ping-api:/mnt/c/tmp/ping-api
      - /DATA/ping/api:/DATA/ping/api
    #environment:
    #  CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "4310:3310"

volumes:
  clam_db:
