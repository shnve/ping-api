version: '3.1'

services:
  db:
    container_name: ping_api_db
    restart: unless-stopped
    build:
      context: ./
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ping-api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      - POSTGRES_DB=${POSTGRES_DB:-ping-api}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  geoserver:
    image: kartoza/geoserver:latest
    container_name: geoserver_local
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_USER:-admin}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_PASSWORD:?Defina GEOSERVER_PASSWORD en .env}
      - INITIAL_MEMORY=2G
      - MAXIMUM_MEMORY=4G
      - CORS_ENABLED=true
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - "./geotiff:/mnt/geotiff"
  gdal_worker:
    image: ghcr.io/osgeo/gdal:ubuntu-full-latest
    container_name: gdal_s100_transcoder
    depends_on:
      - db
    volumes:
      - "./geotiff/pdf1:/data"
      - "./import_pdf_to_cog.sh:/import_pdf_to_cog.sh"
    command: /bin/bash /import_pdf_to_cog.sh
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ping_keycloak
    restart: unless-stopped
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD en .env}
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-themes:/opt/keycloak/themes
    command: start-dev

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # AQUI ESTA LA MAGIA:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mailpit:
    image: axllent/mailpit:latest
    container_name: ping-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  geoserver_data:
  postgres_data:
  keycloak_data:
