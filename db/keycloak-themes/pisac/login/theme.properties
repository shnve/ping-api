# PISAC (F5.3.6): tema de inicio de sesion para los realms ping-public y ping-pro.
# Hereda de "keycloak" (Keycloak 26.x) y sustituye template.ftl (cabecera institucional, panel por realm y pie)
# y la hoja de estilos (login.css del padre -> css/pisac-login.css). Las demas paginas (.ftl) son las del padre.
parent=keycloak
import=common/keycloak
locales=es,en
styles=css/pisac-login.css

# URL del portal para los enlaces "Volver al portal" y "Registrate". En Docker la define PISAC_PORTAL_URL
# (docker-compose: PING_PORTAL_URL). Solo se usa si el cliente ping-web no tiene URL base.
pisacPortalUrl=${env.PISAC_PORTAL_URL:http://localhost:4200}