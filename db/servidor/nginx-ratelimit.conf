# PISAC: zonas de rate limiting en Nginx (contexto http — Checklist 1.10).
#
# Instalar en el servidor:
#   sudo cp db/servidor/nginx-ratelimit.conf /etc/nginx/conf.d/pisac-ratelimit.conf
# y referenciar en /etc/nginx/sites-available/pisac dentro de cada location:
#   - /auth/            -> limit_req zone=pisac_auth burst=20 nodelay;
#   - /api/, /nw/, /secom/ -> limit_req zone=pisac_api burst=60 nodelay;
#
# Comprobar y aplicar:
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=pisac_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pisac_api:10m  rate=30r/s;
limit_req_status 429;
