# PISAC: endurecimiento de cabeceras HTTP y rutas internas en Nginx.
# Referencia: docs-internos/Informe_Revision_Seguridad_PISAC.md (§4.2 y §5.2)
#
# Instalar en el servidor:
#   sudo cp db/servidor/nginx-seguridad.conf /etc/nginx/snippets/pisac-seguridad.conf
# y dentro del bloque server de /etc/nginx/sites-available/pisac (antes de «location / {»):
#   include snippets/pisac-seguridad.conf;
#
# Comprobar y aplicar:
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTAS:
#  - En Nginx, si un bloque «location» define su propio «add_header», no hereda los «add_header»
#    del bloque «server». Ningún bloque de pisac-servicios-datos.conf define add_header.
#  - Parcheo de binario Nginx (CVE-2026-123007 / CVE-2026-123633 / CVE-2026-123634, USN-9159-1):
#    server_tokens off solo oculta la versión. Verificar «dpkg-query -W nginx» >= 1.24.0-2ubuntu7.20
#    y ejecutar «sudo systemctl restart nginx» (no solo reload) tras actualizar el paquete.

# Ocultar versión de Nginx en cabecera «Server» y páginas de error (ZAP 20020 / 10036)
server_tokens off;

# Cabeceras de seguridad HTTP (ZAP 10021, 10020, 10038)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

# CSP compatible con Angular SPA, OpenLayers/MapLibre GL (workers blob:, PMTiles, canvas/PDF),
# PrimeNG/Summernote, Swagger UI (/swagger-ui/) y Keycloak (/auth/) servidos bajo el mismo origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

# Activar SOLO en el bloque HTTPS (listen 443 ssl) cuando el certificado TLS definitivo esté operativo:
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_prefer_server_ciphers off;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Bloquear métodos HTTP inseguros (Checklist 1.17)
if ($request_method ~* ^(TRACE|TRACK)$) {
    return 405;
}

# Defensa en profundidad: bloquear rutas internas/diagnóstico del backend hacia internet
location ^~ /internal/ {
    return 404;
}

location ^~ /actuator/ {
    return 404;
}
