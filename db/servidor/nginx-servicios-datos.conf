# PISAC: servicios de datos públicos (página /static/data-services). Docs: docs-internos/Servicios_Datos_PISAC.md
# Instalar:  sudo cp db/servidor/nginx-servicios-datos.conf /etc/nginx/snippets/pisac-servicios-datos.conf
# y dentro del bloque server de /etc/nginx/sites-available/pisac, antes de «location / {»:
#     include snippets/pisac-servicios-datos.conf;

# API REST S-124
location /nw/ {
    proxy_pass http://127.0.0.1:8080/nw/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SECOM (IEC 63173-2)
location /secom/ {
    proxy_pass http://127.0.0.1:8080/secom/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Referencia de la API: solo el grupo «datos». La configuración de Swagger la sirve Nginx para que la interfaz
# no liste los grupos internos; cualquier otro /v3/api-docs/... cae en «location /» (el portal).
location /swagger-ui/ {
    proxy_pass http://127.0.0.1:8080/swagger-ui/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /v3/api-docs/swagger-config {
    default_type application/json;
    return 200 '{"configUrl":"/v3/api-docs/swagger-config","urls":[{"url":"/v3/api-docs/datos","name":"PISAC - Servicios de datos (S-124 / SECOM)"}],"validatorUrl":""}';
}

location = /v3/api-docs/datos {
    proxy_pass http://127.0.0.1:8080/v3/api-docs/datos;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
