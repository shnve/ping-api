# =============================================================================================
# PISAC: infraestructura de los servidores de desarrollo y producción (64 GB RAM, 48 núcleos, HDD)
#
# Requiere Docker Compose v2 (`docker compose`, v2.24 o superior): usa mem_limit, shm_size y
# bloques de extensión x-*. Ver docs-internos/Ajuste_Recursos_Servidores_PISAC.md
#
# Ajustes de recursos (paso 1, 14-nov-2026):
#   - restart: unless-stopped en los servicios permanentes (vuelven solos tras reiniciar el servidor).
#     gdal_worker NO lleva restart: es una tarea de una sola ejecución.
#   - Rotación de logs de Docker (50 MB x 5 archivos por contenedor).
#   - PostgreSQL: shm_size 2g (las consultas paralelas necesitan memoria compartida; Docker da 64 MB).
#   - Keycloak: mem_limit 3g (sin límite, su JVM toma como base los 64 GB del equipo).
#
# Paso 2 (14-nov-2026): PostgreSQL ajustado a 64 GB / HDD (mem_limit 24g), GeoServer con heap fijo de 10 GB
# (mem_limit 14g), límites de Kafka (2g), ZooKeeper (1g) y GDAL (4g, 16 núcleos).
# =============================================================================================

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  db:
    container_name: ping_api_db
    restart: unless-stopped
    <<: *logging
    build:
      context: ./
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ping-api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      - POSTGRES_DB=${POSTGRES_DB:-ping-api}
    shm_size: 2g
    # Paso 2 (14-nov-2026): parámetros para 64 GB de RAM y disco HDD en RAID 5 (Ajuste_Recursos_Servidores_PISAC.md §3)
    mem_limit: 24g
    command: >
      postgres
        -c shared_buffers=16GB
        -c effective_cache_size=40GB
        -c work_mem=32MB
        -c maintenance_work_mem=2GB
        -c max_connections=150
        -c wal_buffers=16MB
        -c min_wal_size=1GB
        -c max_wal_size=8GB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=4
        -c effective_io_concurrency=2
        -c max_worker_processes=16
        -c max_parallel_workers=12
        -c max_parallel_workers_per_gather=4
        -c max_parallel_maintenance_workers=4
        -c autovacuum_max_workers=4
        -c log_min_duration_statement=2000
    volumes:
      - postgres_data:/var/lib/postgresql/data
  geoserver:
    image: kartoza/geoserver:latest
    container_name: geoserver_local
    restart: unless-stopped
    <<: *logging
    ports:
      - "8082:8080"
    # Paso 2: heap fijo de 10 GB (sin pausas por crecer/encoger) y 4 GB fuera del heap para GDAL nativo y lectura de COG
    mem_limit: 14g
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_USER:-admin}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_PASSWORD:?Defina GEOSERVER_PASSWORD en .env}
      - INITIAL_MEMORY=10G
      - MAXIMUM_MEMORY=10G
      - CORS_ENABLED=true
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - "./geotiff:/mnt/geotiff"
  gdal_worker:
    image: ghcr.io/osgeo/gdal:ubuntu-full-latest
    container_name: gdal_s100_transcoder
    <<: *logging
    # Paso 2: la conversión de cartografía no debe acaparar la CPU ni la memoria del servidor
    mem_limit: 4g
    cpus: 16
    environment:
      - GDAL_NUM_THREADS=16
      - GDAL_CACHEMAX=2048
    depends_on:
      - db
    volumes:
      - "./geotiff/pdf1:/data"
      - "./import_pdf_to_cog.sh:/import_pdf_to_cog.sh"
    command: /bin/bash /import_pdf_to_cog.sh
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: ping_keycloak
    restart: unless-stopped
    <<: *logging
    # Heap ~2 GB (la imagen usa el 70 % del límite del contenedor)
    mem_limit: 3g
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD en .env}
      # PISAC: URL del portal para el enlace «Volver al portal» del tema de inicio de sesión
      - PISAC_PORTAL_URL=${PING_PORTAL_URL:-http://localhost:4200}
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-themes:/opt/keycloak/themes
    # PISAC: modo desarrollo. Para produccion (HTTPS, hostname fijo, PostgreSQL) usar ademas
    # docker-compose.keycloak-prod.yml tras la migracion descrita en Guia_Despliegue_PISAC.md 2.5
    command: start-dev

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    restart: unless-stopped
    <<: *logging
    mem_limit: 1g
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka
    restart: unless-stopped
    <<: *logging
    mem_limit: 2g
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # AQUI ESTA LA MAGIA:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mailpit:
    image: axllent/mailpit:latest
    container_name: ping-mailpit
    restart: unless-stopped
    <<: *logging
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  geoserver_data:
  postgres_data:
  keycloak_data:
